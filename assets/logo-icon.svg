<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">TPCC-Tester icon</title>
  <desc id="desc">Rounded tile with database cylinder, throughput bars, and pass check</desc>
  <defs>
    <linearGradient id="tile" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="45%" stop-color="#0F274F"/>
      <stop offset="100%" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="dbBody" x1="40" y1="34" x2="88" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="dbTop" x1="40" y1="30" x2="88" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)"/>
  <rect x="7.5" y="7.5" width="113" height="113" rx="28.5" fill="none" stroke="#67E8F9" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- soft grid hint -->
  <g opacity="0.12" stroke="#67E8F9" stroke-width="0.8">
    <path d="M24 40h80M24 56h80M24 72h80M24 88h80"/>
    <path d="M40 28v72M56 28v72M72 28v72M88 28v72"/>
  </g>

  <g filter="url(#glow)">
    <path d="M42 48c0-7.2 9.9-13 22-13s22 5.8 22 13v34c0 7.2-9.9 13-22 13s-22-5.8-22-13V48z" fill="url(#dbBody)"/>
    <ellipse cx="64" cy="48" rx="22" ry="13" fill="url(#dbTop)"/>
    <path d="M42 60c2 5.8 11 10.2 22 10.2S84 65.8 86 60" fill="none" stroke="#0E7490" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M42 72c2 5.8 11 10.2 22 10.2S84 77.8 86 72" fill="none" stroke="#0E7490" stroke-opacity="0.35" stroke-width="1.4"/>
    <ellipse cx="64" cy="82" rx="22" ry="13" fill="none" stroke="#155E75" stroke-opacity="0.55" stroke-width="1.4"/>
  </g>

  <g transform="translate(78 52)">
    <rect x="0" y="24" width="7" height="14" rx="2" fill="url(#bars)" opacity="0.8"/>
    <rect x="10" y="14" width="7" height="24" rx="2" fill="url(#bars)" opacity="0.92"/>
    <rect x="20" y="4" width="7" height="34" rx="2" fill="url(#bars)"/>
    <path d="M1.5 30 L13.5 18 L23.5 8" fill="none" stroke="#F0FDFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="40" cy="90" r="10" fill="#042F2E" opacity="0.75"/>
  <circle cx="40" cy="90" r="10" fill="none" stroke="#5EEAD4" stroke-opacity="0.55" stroke-width="1.2"/>
  <path d="M35 90.3l3 3 7-7.2" fill="none" stroke="#5EEAD4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
