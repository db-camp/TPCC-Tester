<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" role="img" aria-labelledby="title desc">
  <title id="title">TPCC-Tester</title>
  <desc id="desc">Horizontal logo for TPCC-Tester: database and benchmark mark with wordmark</desc>
  <defs>
    <linearGradient id="bg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B4F8A"/>
      <stop offset="55%" stop-color="#0A3366"/>
      <stop offset="100%" stop-color="#071E3D"/>
    </linearGradient>
    <linearGradient id="db" x1="40" y1="28" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="word" x1="148" y1="40" x2="420" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Mark (same geometry as logo-icon.svg) -->
  <g id="mark">
    <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
    <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" fill="none" stroke="#94A3B8" stroke-opacity="0.22" stroke-width="1.5"/>
    <g filter="url(#soft)">
      <path d="M40 46c0-7.5 10.7-13.5 24-13.5S88 38.5 88 46v36c0 7.5-10.7 13.5-24 13.5S40 89.5 40 82V46z" fill="url(#db)" fill-opacity="0.92"/>
      <ellipse cx="64" cy="46" rx="24" ry="13.5" fill="#E0F2FE"/>
      <ellipse cx="64" cy="46" rx="24" ry="13.5" fill="none" stroke="#BAE6FD" stroke-width="1.5"/>
      <path d="M40 58c2.2 6.2 12 11 24 11s21.8-4.8 24-11" fill="none" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M40 70c2.2 6.2 12 11 24 11s21.8-4.8 24-11" fill="none" stroke="#0284C7" stroke-opacity="0.28" stroke-width="1.5"/>
      <ellipse cx="64" cy="82" rx="24" ry="13.5" fill="none" stroke="#0369A1" stroke-opacity="0.45" stroke-width="1.5"/>
    </g>
    <g transform="translate(78 54)">
      <rect x="0" y="22" width="7" height="14" rx="2" fill="url(#bar)" opacity="0.85"/>
      <rect x="10" y="14" width="7" height="22" rx="2" fill="url(#bar)" opacity="0.92"/>
      <rect x="20" y="6" width="7" height="30" rx="2" fill="url(#bar)"/>
      <path d="M1 28 L13.5 18 L23.5 10" fill="none" stroke="#F0FDFA" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    </g>
    <circle cx="38" cy="88" r="9" fill="#042F2E" opacity="0.55"/>
    <path d="M33.5 88.2l2.8 2.8 6.2-6.5" fill="none" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" fill="url(#word)">
    <text x="148" y="72" font-size="42" font-weight="700" letter-spacing="-0.5">TPCC</text>
    <text x="278" y="72" font-size="42" font-weight="500" letter-spacing="-0.5" fill="#334155">-Tester</text>
  </g>
  <text x="150" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" letter-spacing="1.6" fill="#0D9488">RMDB · TPC-C BENCHMARK</text>
</svg>
